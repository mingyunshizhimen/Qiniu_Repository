[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qiniu-ai-interpreter"
version = "0.1.0"
description = "AI simultaneous interpreter for technical meetings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "websockets>=14.2,<16.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
